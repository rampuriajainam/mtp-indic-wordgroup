# Rsd_soft: Rsd + soft-label distillation (KL to head 0 = the base model, all positions; S3_all, lambda 1). 2k pilot: +0.019 tokens/step [+0.009, +0.031]
# Run matrix: docs/plan/README.md §6. Fields: INTERFACES §6 (+ optional: head_layers, optim.grad_accum,
# optim.weight_decay, data.eval_n, weighting.head_decay, log_every). TBD = decided later; train.py fails loudly on it.
run_name: Rsd_hi_k4_frozen_sd_soft
lang: hi
model_name: LingoIITGN/ganga-1b
num_heads: 4
head_type: resblock
head_layers: 1
freeze_backbone: true   # Medusa-1: LoRA frozen, head 0 = base model exactly
head_backbone_grad: 0.1   # extra heads send 10% of their gradient into LoRA (2k-step pilot: head 0 +0.011 vs R0)
lora: {r: 8, alpha: 16, dropout: 0.05, targets: [q_proj, v_proj]}
optim: {lr: 2.0e-4, batch_size: 8, grad_clip: 1.0, max_steps: 12500, grad_accum: 1, weight_decay: 0.01}
data: {cache_dir: /kaggle/input/mtp-boundary-cache, grouper: hi_rules_v0, max_length: 128, eval_split: eval, eval_n: 1000, train_file: /kaggle/working/sd/hi_sd.jsonl}  # -> hi_rules_v1 when JI-1 lands
losses:
  structural: {enabled: true, variant: S3_all, weight: 1.0, lambda_s3: 1.0}  # KL( sg[head 0 at t+d] || head d at t ) on every position
  contrastive: {enabled: false, weight: 0.05, temperature: 0.1}
weighting: {scheme: fixed, head_decay: 0.8}
log_every: 20
eval_every: 1000
save_every: 500
seed: 42
dtype: auto
